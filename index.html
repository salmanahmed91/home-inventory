<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob: mediastream:; connect-src https://login.microsoftonline.com https://graph.microsoft.com https://*.microsoftpersonalcontent.com https://*.1drv.com https://*.sharepoint.com https://world.openfoodfacts.org https://world.openbeautyfacts.org https://world.openproductsfacts.org https://world.openpetfoodfacts.org; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#2f6f4f">
<title>Home Inventory</title>
<style>
:root{
  --bg:#f6f5f1;--card:#fff;--ink:#1f2420;--muted:#6b726c;--line:#e3e1da;
  --accent:#2f6f4f;--accent-ink:#fff;--warn:#b7791f;--warn-bg:#fdf3e1;
  --bad:#b3261e;--bad-bg:#fbe9e7;--ok-bg:#e8f2ec;--chip:#eeece6;
}
@media (prefers-color-scheme: dark){
  :root{--bg:#141614;--card:#1d201d;--ink:#e8ebe7;--muted:#9aa29b;--line:#2e332f;
  --accent:#5fae86;--accent-ink:#0f1a14;--warn:#e0a84a;--warn-bg:#33291a;--bad:#ef7d74;--bad-bg:#3a1f1d;--ok-bg:#1f3128;--chip:#272b27;}
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:12px 16px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:8px}
.top h1{font-size:20px;margin:0;flex:1}
.sync{font-size:12px;color:var(--muted)}
main{padding:12px 16px 110px;max-width:760px;margin:0 auto}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:6;display:flex;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs button{flex:1;border:0;background:none;padding:10px 4px 12px;font-size:13px;color:var(--muted);position:relative}
nav.tabs button.on{color:var(--accent);font-weight:600}
nav.tabs .ico{display:block;font-size:20px;line-height:1.1}
.badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--bad);color:#fff;border-radius:10px;font-size:11px;padding:0 6px;min-width:18px}
.btn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;cursor:pointer}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--card);margin-top:8px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 0 2px;scrollbar-width:none}
.chip{white-space:nowrap;border:0;background:var(--chip);border-radius:16px;padding:5px 12px;font-size:14px;cursor:pointer}
.chip.on{background:var(--accent);color:var(--accent-ink)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin:18px 0 6px}
.list{background:var(--card);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:flex;align-items:center;gap:10px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .main{flex:1;min-width:0;cursor:pointer}
.row .name{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:13px;color:var(--muted);display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:2px}
.tag{font-size:12px;border-radius:6px;padding:0 6px}
.tag.low{background:var(--warn-bg);color:var(--warn)}
.tag.bad{background:var(--bad-bg);color:var(--bad)}
.tag.ok{background:var(--ok-bg);color:var(--accent)}
.qty{display:flex;align-items:center;gap:4px}
.qty b{min-width:44px;text-align:center;font-variant-numeric:tabular-nums}
.qty button{width:38px;height:38px;border-radius:50%;border:1px solid var(--line);background:var(--bg);font-size:20px;line-height:1;cursor:pointer}
.check{width:26px;height:26px;accent-color:var(--accent)}
.done .name{text-decoration:line-through;color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:32px 12px}
.fab{position:fixed;right:18px;bottom:calc(76px + env(safe-area-inset-bottom));z-index:6;width:56px;height:56px;border-radius:50%;border:0;background:var(--accent);color:var(--accent-ink);font-size:30px;box-shadow:0 4px 14px rgba(0,0,0,.25);cursor:pointer}
dialog{border:0;border-radius:16px;padding:0;width:min(520px,calc(100vw - 24px));background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.45)}
.dlg{padding:16px}
.dlg h3{margin:0 0 12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid .full{grid-column:1/-1}
label{display:block;font-size:13px;color:var(--muted)}
label input,label select,label textarea{display:block;width:100%;margin-top:3px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}
.actions .left{margin-right:auto}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:12px}
.card p{margin:6px 0}
.muted{color:var(--muted);font-size:14px}
.inline{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
video{width:100%;border-radius:12px;background:#000;max-height:50vh;object-fit:cover}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:10px;font-size:14px;z-index:20;opacity:0;transition:opacity .2s;pointer-events:none;max-width:90vw}
.toast.show{opacity:1}

.thumb{border-radius:8px;object-fit:contain;background:#fff;flex:none;border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;color:var(--muted)}
.pick{cursor:pointer}.pick:hover{background:var(--chip)}
code{background:var(--chip);padding:1px 5px;border-radius:4px;font-size:13px;word-break:break-all}
</style>
</head>
<body>
<header>
  <div class="top">
    <h1>Home Inventory</h1>
    <span class="sync" id="syncState"></span>
    <button class="btn" id="scanBtn" title="Scan a barcode">▦ Scan</button>
  </div>
  <div id="headerExtra"></div>
</header>
<main id="view"></main>
<button class="fab" id="fab" title="Add item">+</button>
<nav class="tabs" id="tabs">
  <button data-tab="items" class="on"><span class="ico">🏠</span>Items</button>
  <button data-tab="shop"><span class="ico">🛒</span>Shopping<span class="badge" id="shopBadge" hidden></span></button>
  <button data-tab="soon"><span class="ico">⏰</span>Use soon<span class="badge" id="soonBadge" hidden></span></button>
  <button data-tab="settings"><span class="ico">⚙️</span>Settings</button>
</nav>
<dialog id="dlg"><div class="dlg" id="dlgBody"></div></dialog>
<div class="toast" id="toast"></div>

<script src="app.js"></script>
</body>
</html>
